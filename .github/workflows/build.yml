name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the build it replaces, which saves
# Actions minutes and keeps two builds from publishing at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch on-device models
        run: ./scripts/fetch-models.sh

      - name: Set up signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Pushes to main already publish the APK as a release (release files don't
      # count against the private repo's 0.5 GB Actions storage), so only pull
      # request and manual builds keep an artifact, for one day.
      - name: Upload APK
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: native-finds-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

      - name: Publish release (main branch)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk native-finds.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" native-finds.apk \
            --title "Native Finds 0.1.${{ github.run_number }}" \
            --notes "Automatic build from ${GITHUB_SHA::7}. Download native-finds.apk on your phone to install." \
            --latest
