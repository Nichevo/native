name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job below asks for more.
permissions:
  contents: read

# A newer push to the same branch cancels the build it replaces, which saves
# Actions minutes and keeps two builds from publishing at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (version in the comment); Dependabot
# opens pull requests to move them forward.

jobs:
  # Pull request builds: read-only token, no secrets, signed with the shared
  # debug key. The APK is kept as an artifact for one day.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Fetch on-device models
        run: ./scripts/fetch-models.sh

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-finds-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

  # Pushes to main / tags and manual runs: signed with the release key from
  # secrets. Pushes publish a GitHub release, which is the only step that needs
  # contents: write. Never runs for pull requests.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Fetch on-device models
        run: ./scripts/fetch-models.sh

      - name: Set up signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Pushes publish the APK as a release (release files don't count against
      # the private repo's 0.5 GB Actions storage), so only manual builds keep
      # an artifact, for one day.
      - name: Upload APK
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-finds-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk native-finds.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" native-finds.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Native Finds 0.1.${{ github.run_number }}" \
            --notes "Automatic build from ${GITHUB_SHA::7}. Download native-finds.apk on your phone to install." \
            --latest
